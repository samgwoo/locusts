title = "Trial Intern"
requires = { mock_trial = 2 }
pay = 1.1

[[role]]
id = "dechert_sa"
company = "Dechert"
title = "Summer Associate"
requires = { biglaw = 1 }
pay = 1.0

[[role]]
id = "morgan_lewis_sa"
company = "Morgan Lewis"
title = "Summer Associate"
requires = { biglaw = 2 }
pay = 1.1

[[role]]
id = "cls_intern"
company = "Community Legal Services"
