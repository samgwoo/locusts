# College houses, loaded by locusts/houses.py. A pet picks one when it hatches and lives there: it walks
# home to it, sleeps there, and counts toward its house on the leaderboard.
#
# Each house has an id, name, map_name (a building in locusts/static/map/buildings.json), blurb, and a
# small `effects` table using the same perks shop items may use (see ITEM_EFFECTS in locusts/shop.py).
# Where a house sits matters too, since farther buildings take longer to walk to.

[[house]]
id = "harnwell"
name = "Harnwell"
map_name = "Harnwell College House"
blurb = "High-rise singles: sleep restores energy 5% faster."
effects = { sleep_regen = 0.05 }

