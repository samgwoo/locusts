]

[[event]]
id = "spill"
when = "task"
title = "Something spilled"
text = "Someone knocked over an entire iced latte by the door."
options = [
    { label = "Clean it up", effects = { money = 4, energy = -6 } },
    { label = "Put out a wet floor sign and take a break", effects = { energy = 10, money = -1 } },
]

