# Shop items, loaded by locusts/shop.py.
#
# Each item has an id, name, category (a key of [categories]), price, blurb, and `effects` table using
# the perk names in locusts/perks.py (only the ones shop.py allows). Optional fields:
#   weekly   = true    a subscription, billed every config.subscription_days until cancelled or broke
#   swag     = 20      what owning it adds to the pet's swag; a permanent item's swag is under its price
#   replaces = "id"    an upgrade: needs that item, and buying it trades the old one in
#   swipes   = 14      meals each billing period, reset at renewal
#   wear     = "head"  something the pet wears, drawn on it on the map (see shop.WEAR_SLOTS); in each slot it
#                      wears the one with the most swag

[categories]
gear = "Gear"
style = "Wardrobe"
dorm = "Dorm room"
plans = "Subscriptions"
travel = "Getting around"

[[item]]
id = "thinkpad"
name = "Used ThinkPad"
category = "gear"
price = 60
swag = 20
blurb = "+10% training XP. The keyboard is still great."
effects = { training_xp = 0.10 }

[[item]]
id = "macbook"
name = "MacBook Pro"
category = "gear"
price = 180
swag = 70
replaces = "thinkpad"
blurb = "+20% training XP. Trades in your ThinkPad."
effects = { training_xp = 0.20 }

